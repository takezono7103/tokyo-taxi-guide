<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GO営業クイック 独立テスト v0.1.1</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1b2c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;padding:14px}header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}h1{font-size:19px;margin:0}.small{font-size:11px;color:#aebfd1}.pill{font-size:11px;background:#31465f;border-radius:20px;padding:6px 9px}.card{background:#1c3048;border:1px solid #344a65;border-radius:15px;padding:14px;margin:10px 0}.label{font-size:12px;color:#bdd0e2}.status{font-size:25px;font-weight:800;margin:7px 0}.timer{font-variant-numeric:tabular-nums;font-size:18px}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}button{color:white;border:0;border-radius:13px;font-size:19px;font-weight:800;min-height:76px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white}button:active{filter:brightness(1.15)}.vacant{background:#c62e38}.occupied{background:#1469c9}.break{background:#4b6078}.selected{outline:3px solid #fff;outline-offset:2px}.bar{display:flex;gap:8px;flex-wrap:wrap}.secondary{min-height:43px;font-size:13px;background:#30455f;padding:10px 14px;flex:1}.warning{font-size:12px;color:#f7d7a3;line-height:1.6}.note{font-size:12px;color:#b7c8dc;line-height:1.6}.feedback{min-height:22px;font-size:13px;color:#a8edc0}dialog{border:1px solid #7892ac;background:#20354d;color:white;border-radius:14px;padding:20px;max-width:min(360px,90vw)}dialog::backdrop{background:#0009}dialog button{min-height:50px;font-size:15px;padding:8px 15px}#confirm{background:#1872ca}#cancel{background:#50647b}@media(min-width:650px){body{max-width:600px;margin:auto}.actions{grid-template-columns:repeat(3,1fr)}button{font-size:16px}}@media(max-width:350px){h1{font-size:16px}.status{font-size:22px}}
/* v0.1.1: iPad Split View narrow-window layout; original logic unchanged */
html{width:100%;overflow-x:hidden}
body{width:100%;min-width:0;max-width:600px;margin:0 auto;padding:10px;overflow-x:hidden}
header{min-width:0;align-items:flex-start}
header>div{min-width:0;flex:1}
h1{overflow-wrap:anywhere;line-height:1.2}
.pill{flex:none;white-space:nowrap}
.card{min-width:0}
.actions{grid-template-columns:minmax(0,1fr)!important;gap:9px;margin:10px 0}
.actions button{width:100%;min-width:0;min-height:76px;font-size:19px}
.bar{min-width:0}
.secondary{min-width:0;overflow-wrap:anywhere}
@media(max-width:430px){
 body{padding:8px}
 header{gap:5px;margin-bottom:7px}
 h1{font-size:clamp(14px,4.2vw,19px)}
 .pill{font-size:10px;padding:5px 7px}
 .card{padding:10px;margin:8px 0}
 .status{font-size:22px}
 .actions button{min-height:72px}
 .secondary{font-size:12px;padding:8px 6px}
 .warning,.note{font-size:11px}
}
</style></head><body><header><div><h1>🚕 GO営業クイック</h1><div class="small">独立テスト v0.1.1｜NAVITIMEとの2画面用</div></div><span class="pill">試験専用</span></header><div class="card"><div class="label">現在の営業状態</div><div id="status" class="status" aria-live="polite">未開始</div><div class="label">この状態の経過時間</div><div id="elapsed" class="timer">00:00:00</div></div><div class="actions"><button id="vacant" class="vacant" type="button">🚕 空車<br><span style="font-size:13px">営業開始</span></button><button id="occupied" class="occupied" type="button">🚙 実車<br><span style="font-size:13px">配車あり</span></button><button id="break" class="break" type="button">☕ 回送<br><span style="font-size:13px">休憩</span></button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="bar"><button id="undo" class="secondary" type="button">↶ 直前の操作を戻す</button><button id="reset" class="secondary" type="button">テスト記録を消去</button></div><div class="card"><div class="warning">⚠ この画面は独立テストです。正式コックピットの営業状態・休憩時間・ログには連動しません。実際の乗務記録として使用しないでください。</div><p class="note">操作は安全な停車中に行ってください。GPSやナビの画面切替によって営業状態は自動変更されません。画面を閉じてもこのテスト画面の状態だけは端末内に保存されます。</p></div><dialog id="dialog"><p id="question"></p><div class="bar"><button id="cancel" type="button">キャンセル</button><button id="confirm" type="button">切り替える</button></div></dialog><script>(()=>{'use strict';const key='goQuickIndependentTestV01';const names={vacant:'空車・営業中',occupied:'実車配車あり',break:'回送・休憩'};let state={mode:null,since:null,history:[]};try{const x=JSON.parse(localStorage.getItem(key));if(x&&typeof x==='object'&&(!x.mode||names[x.mode]))state={mode:x.mode||null,since:Number.isFinite(x.since)?x.since:null,history:Array.isArray(x.history)?x.history.slice(-10):[]}}catch(e){}const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('feedback').textContent='保存できません。ブラウザの設定をご確認ください。'}};const render=()=>{$('status').textContent=state.mode?names[state.mode]:'未開始';for(const id of Object.keys(names)){$(id).classList.toggle('selected',state.mode===id);$(id).setAttribute('aria-pressed',String(state.mode===id))}const secs=state.since?Math.max(0,Math.floor((Date.now()-state.since)/1000)):0;$('elapsed').textContent=[Math.floor(secs/3600),Math.floor(secs%3600/60),secs%60].map(n=>String(n).padStart(2,'0')).join(':');$('undo').disabled=!state.history.length};let pending=null;for(const id of Object.keys(names))$(id).onclick=()=>{if(state.mode===id){$('feedback').textContent='すでに「'+names[id]+'」です';return}pending=id;$('question').textContent='営業状態を「'+names[id]+'」に切り替えますか？';$('dialog').showModal()};$('cancel').onclick=()=>{$('dialog').close();pending=null};$('confirm').onclick=()=>{if(!pending)return;state.history.push({mode:state.mode,since:state.since});state.history=state.history.slice(-10);state.mode=pending;state.since=Date.now();pending=null;save();render();$('dialog').close();$('feedback').textContent='切り替えました'};$('undo').onclick=()=>{const old=state.history.pop();if(!old)return;state.mode=old.mode;state.since=old.since;save();render();$('feedback').textContent='直前の操作を戻しました'};$('reset').onclick=()=>{if(!confirm('この独立テストの状態・履歴だけを消去しますか？'))return;state={mode:null,since:null,history:[]};save();render();$('feedback').textContent='テスト記録を消去しました'};render();setInterval(render,1000)})();</script></body></html>
