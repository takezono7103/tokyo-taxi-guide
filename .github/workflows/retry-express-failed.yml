name: Retry Tokyo expressway failed areas

on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Municipalities (comma separated)'
        required: true
        type: string
        default: '足立区,葛飾区'
      max_depth:
        description: 'Additional subdivisions of failed tiles (0-3)'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '2'

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore successful tile cache from previous runs
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: express-tiles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            express-tiles-
      - name: Retry selected areas
        id: retry
        continue-on-error: true
        env:
          AREAS: ${{ inputs.areas }}
          MAX_DEPTH: ${{ inputs.max_depth }}
        run: python retry_express_failed.py --areas "$AREAS" --max-depth "$MAX_DEPTH"
      - name: Save successful tile cache for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: express-tiles-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload partial results even if some areas fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-express-retry-results
          path: output/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report incomplete coverage
        if: steps.retry.outcome == 'failure'
        run: |
          echo 'Some tiles remain unavailable. Partial JSON and successful tile cache have been saved.'
          echo 'Check remaining-failed-tiles.json in the artifact.'
