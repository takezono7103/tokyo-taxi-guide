name: Test OSM single node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch one OSM node
        run: python scripts/test_osm_single_node.py
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-single-node-result
          path: osm_single_node_result.json
          if-no-files-found: warn
