
name: Update Tokyo oneway access

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch OSM oneway and access
        run: python scripts/fetch_oneway_access.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tokyo_oneway_access.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Tokyo oneway access data"
            git push
          fi

