name: Update Tokyo Metro last trains

on:
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * *'

permissions:
  contents: write

concurrency:
  group: odpt-last-trains
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch station timetables and build last departures
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
        run: python scripts/fetch_last_trains.py
      - name: Commit only last train data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/last_trains.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Tokyo Metro last departure data'
            git push
          fi
