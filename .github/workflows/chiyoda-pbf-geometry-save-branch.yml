name: Save Chiyoda PBF geometry to test branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiyoda-pbf-test-branch
  cancel-in-progress: false

jobs:
  extract-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyosmium
        run: python -m pip install --disable-pip-version-check osmium
      - name: Download Kanto PBF
        run: |
          curl --fail --location --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 1800 \
            --output /tmp/kanto.osm.pbf https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf
          test -s /tmp/kanto.osm.pbf
      - name: Extract and validate
        run: |
          python scripts/extract_chiyoda_geometry_pbf.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('experimental/chiyoda_pbf_geometry/report.json').read_text())
          assert report['input_count']==4524, 'Unexpected input count'
          assert report['found_count']==4524, 'Not all ways extracted'
          assert report['missing_count']==0, 'Missing ways'
          assert not report['invalid'], 'Invalid geometries'
          assert not report['oneway_attribute_differences'], 'One-way attribute conflicts'
          print('VALIDATION OK: 4524 / 4524')
          PY
      - name: Publish only test outputs to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chiyoda-publish
          cp experimental/chiyoda_pbf_geometry/chiyoda_geometry_experimental.geojson /tmp/chiyoda-publish/
          cp experimental/chiyoda_pbf_geometry/report.json /tmp/chiyoda-publish/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Create the branch as an orphan, so no production files are copied.
          git checkout --orphan "chiyoda-geometry-test-${GITHUB_RUN_ID}"
          git rm -rf --ignore-unmatch . >/dev/null
          git clean -fdx >/dev/null
          mkdir -p geometry
          cp /tmp/chiyoda-publish/chiyoda_geometry_experimental.geojson geometry/
          cp /tmp/chiyoda-publish/report.json geometry/
          printf '%s\n' 'EXPERIMENTAL ONLY: OSM geometry is not validated for navigation or legal road restrictions.' > README.txt
          git add geometry README.txt
          git commit -m 'Publish experimental Chiyoda OSM geometry'
          git push origin "HEAD:refs/heads/chiyoda-geometry-test-${GITHUB_RUN_ID}"
          echo "Published to branch: chiyoda-geometry-test-${GITHUB_RUN_ID}"
