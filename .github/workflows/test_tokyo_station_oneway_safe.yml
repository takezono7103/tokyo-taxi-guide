name: Test Tokyo Station oneway safely

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test tiny Tokyo Station OSM one-way sample
        shell: bash
        run: |
          mkdir -p report
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, datetime, pathlib, time
          # Small Tokyo Station vicinity. Bounding box order: south, west, north, east.
          bbox = '35.6795,139.7645,35.6840,139.7700'
          query = f'[out:json][timeout:12];way["highway"]["oneway"]({bbox});out tags center 100;'
          endpoints = [
              'https://overpass.kumi.systems/api/interpreter',
              'https://overpass.private.coffee/api/interpreter',
              'https://overpass-api.de/api/interpreter',
          ]
          report = {'purpose':'Experimental one-way connectivity test only; no routing or production changes',
                    'area':'Tokyo Station vicinity', 'bbox_south_west_north_east':bbox,
                    'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'attempts':[], 'status':'failed', 'count':0}
          for endpoint in endpoints:
              attempt = {'endpoint':endpoint}
              try:
                  body = urllib.parse.urlencode({'data':query}).encode()
                  req = urllib.request.Request(endpoint, data=body,
                       headers={'User-Agent':'tokyo-taxi-guide-experimental-oneway-test/1.0',
                                'Content-Type':'application/x-www-form-urlencoded',
                                'Accept':'application/json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  ways = [e for e in data.get('elements',[]) if e.get('type') == 'way']
                  pathlib.Path('report/tokyo_station_oneway_sample.json').write_text(
                      json.dumps({'source':endpoint,'bbox':bbox,'elements':ways},ensure_ascii=False,indent=2),encoding='utf-8')
                  attempt.update(result='ok',ways=len(ways))
                  report.update(status='success',count=len(ways),source=endpoint)
                  report['attempts'].append(attempt)
                  print('QUERY OK:',endpoint,'ways:',len(ways))
                  break
              except Exception as e:
                  attempt.update(result='failed',error=str(e)[:350])
                  report['attempts'].append(attempt)
                  print('QUERY FAILED:',endpoint,type(e).__name__,str(e)[:200])
                  time.sleep(1)
          pathlib.Path('report/tokyo_station_oneway_test_report.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT:',report['status'],'WAYS:',report['count'])
          print('No production files changed.')
          PY
      - name: Upload test report only
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-station-oneway-safe-test
          path: report/
          if-no-files-found: error
