name: Fetch OSM priority 26

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch 26 OSM nodes
        run: python scripts/fetch_osm_priority26.py
      - name: Commit evidence to data folder
        run: |
          test -f data/tokyo_express_priority26_osm_api_evidence.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tokyo_express_priority26_osm_api_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Save OSM API evidence for 26 expressway nodes"
            git push
          fi
