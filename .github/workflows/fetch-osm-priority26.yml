name: Fetch OSM priority 26

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch 26 OSM nodes
        run: python scripts/fetch_osm_priority26.py
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-priority26-evidence
          path: data/tokyo_express_priority26_osm_api_evidence.json
          if-no-files-found: warn
