
name: Test Chiyoda Access v7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-access:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Download Kanto OSM PBF
        run: |
          curl -fL --retry 3 \
            -o kanto-latest.osm.pbf \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf
          test -s kanto-latest.osm.pbf

      - name: Extract access tags
        run: |
          python scripts/build_chiyoda_access_v7.py \
            chiyoda_oneway_v5_vehicle_priority.html \
            kanto-latest.osm.pbf

      - name: Upload test HTML
        uses: actions/upload-artifact@v4
        with:
          name: chiyoda-access-v7-test
          path: chiyoda_oneway_v7_access_test.html
          if-no-files-found: error
          retention-days: 7

