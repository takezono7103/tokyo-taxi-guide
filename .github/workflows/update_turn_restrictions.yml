
name: Update Tokyo turn restrictions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch OSM turn restrictions
        run: python scripts/fetch_turn_restrictions.py

      - name: Commit restriction data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tokyo_turn_restrictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update OSM turn restrictions'
            git push
          fi
  
