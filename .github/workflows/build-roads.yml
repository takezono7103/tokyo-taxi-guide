name: Build Tokyo road data

on:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 55

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: '3.11'

      - name: Install processors

        run: |

          sudo apt-get update -qq

          sudo apt-get install -y osmium-tool

          python -m pip install osmium

      - name: Download Kanto map

        run: curl --fail --location --retry 3 -o kanto.osm.pbf https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf

      - name: Extract Tokyo area

        run: osmium extract --bbox 139.54,35.49,139.96,35.85 --strategy complete_ways kanto.osm.pbf -o tokyo.osm.pbf

      - name: Generate road data

        run: python scripts/build_roads.py tokyo.osm.pbf --out data

      - name: Check output

        run: test -s data/manifest.json

      - name: Commit road data

        run: |

          git config user.name 'github-actions[bot]'

          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/

          if ! git diff --cached --quiet; then

            git commit -m 'Build Tokyo OSM road tiles'

            git push

          fi
