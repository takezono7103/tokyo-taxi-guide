name: Test ODPT API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ODPT connection
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
        run: python scripts/fetch_odpt.py
