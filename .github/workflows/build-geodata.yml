name: Build Tokyo rail and expressway geodata
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch geodata
        run: python scripts/build_geodata.py
      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tokyo_station_all.json data/tokyo_express_all.json data/collection_errors.json
          git diff --cached --quiet || (git commit -m "Update Tokyo railway and expressway geodata" && git push)
