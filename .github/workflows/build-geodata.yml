name: Build Tokyo rail and expressway geodata
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokyo-geodata-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch geodata
        run: python scripts/build_geodata.py
      - name: Commit generated JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tokyo_station_all.json data/tokyo_express_all.json data/collection_errors.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Tokyo railway and expressway geodata"
            git push
          fi
