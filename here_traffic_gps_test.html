<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERE Traffic GPSテスト</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#17333b;line-height:1.5}input,button{font-size:16px;padding:12px;border-radius:9px}input{width:100%;box-sizing:border-box;border:1px solid #9aa}button{background:#083a48;color:#fff;border:0;margin:8px 8px 8px 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5f6;padding:14px;border-radius:8px}small{color:#52676d}.box{background:#f0f5f6;border-radius:8px;padding:12px;margin:12px 0}.warn{color:#765000}</style></head>
<body><h2>HERE Traffic GPSテスト</h2><p>iPadの現在地を取得し、周辺半径1kmの交通流を<strong>手動で1回</strong>取得します。自動更新・バックグラウンド追跡はしません。</p>
<label for="key">HERE APIキー（保存しません）</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="APIキーを入力">
<div><button id="gps">① GPS現在地を取得</button><button id="run" disabled>② HERE交通情報を取得（1回）</button></div>
<div class="box" id="position">現在地：未取得</div><pre id="result">交通情報：未取得</pre>
<p><small>GPS位置はこのページ内でのみ使用します。交通情報取得時は、位置情報とAPIキーをHEREに送信します。キーは画面・URL欄・保存領域には表示しませんが、ブラウザのネットワークリクエストには含まれます。GitHub PagesのHTTPS URLで開いてください。画面を閉じると入力内容は失われます。</small></p>
<script>
(()=>{'use strict';const key=document.getElementById('key'),gps=document.getElementById('gps'),run=document.getElementById('run'),position=document.getElementById('position'),result=document.getElementById('result');let coords=null;
gps.onclick=()=>{if(!navigator.geolocation){position.textContent='このブラウザは位置情報に対応していません。';return}gps.disabled=true;position.textContent='GPS位置を取得中…（位置情報の許可が必要です）';navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};position.textContent=`現在地：緯度 ${coords.lat.toFixed(5)}、経度 ${coords.lng.toFixed(5)}\n位置精度の目安：±${Math.round(coords.accuracy)}m`;run.disabled=false;gps.disabled=false},e=>{position.textContent='位置情報を取得できません：'+({1:'位置情報の使用が許可されていません',2:'位置情報を特定できません',3:'取得がタイムアウトしました'}[e.code]||e.message)+'。Safariの位置情報設定とGPS受信状態を確認してください。';gps.disabled=false},{enableHighAccuracy:true,timeout:20000,maximumAge:0})};
run.onclick=async()=>{if(!coords){result.textContent='先にGPSを取得してください。';return}const k=key.value.trim();if(!k){result.textContent='HERE APIキーを入力してください。';return}run.disabled=true;result.textContent='HERE交通情報を取得中…';try{const url=new URL('https://data.traffic.hereapi.com/v7/flow');url.searchParams.set('in',`circle:${coords.lat.toFixed(6)},${coords.lng.toFixed(6)};r=1000`);url.searchParams.set('locationReferencing','none');url.searchParams.set('apiKey',k);const response=await fetch(url,{cache:'no-store',referrerPolicy:'strict-origin-when-cross-origin'});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{data={message:raw.slice(0,300)}}if(!response.ok){result.textContent='HTTP '+response.status+'：取得失敗\n'+JSON.stringify(data,null,2).slice(0,800);return}const rows=Array.isArray(data.results)?data.results:[];const jams=rows.map(x=>x.currentFlow?.jamFactor).filter(Number.isFinite);const lines=rows.slice(0,15).map((x,i)=>{const f=x.currentFlow||{};const speed=Number.isFinite(f.speed)?Math.round(f.speed*3.6)+'km/h':'不明';const free=Number.isFinite(f.freeFlow)?Math.round(f.freeFlow*3.6)+'km/h':'不明';return `${i+1}. 現在速度 ${speed} / 自由流速度 ${free} / 渋滞度 ${Number.isFinite(f.jamFactor)?f.jamFactor:'不明'}`});result.textContent=`HTTP ${response.status}：認証・取得成功\n更新時刻：${data.sourceUpdated||'不明'}\n道路区間：${rows.length}件\n最大渋滞度：${jams.length?Math.max(...jams):'不明'}\n\n道路区間ごとの交通流（最大15件）\n${lines.length?lines.join('\n'):'この範囲のデータはありません'}\n\n※道路名・進行方向はこの簡易テストでは表示しません。`;}catch(e){result.textContent='通信エラー：'+e.message+'\n接続環境・ドメイン制限・HEREの利用状況を確認してください。'}finally{run.disabled=false}};
})();
</script></body></html>
