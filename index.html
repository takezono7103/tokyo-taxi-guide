<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1623"><meta name="apple-mobile-web-app-capable" content="yes"><title>東京タクシー 道路・交差点案内</title><style>body{margin:0;background:#0b1623;color:#f5f8ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 70px}.card{background:#18293b;border-radius:18px;padding:20px;margin:14px 0}.sub{color:#b2c7d8;font-size:14px}.big{font-size:30px;font-weight:800;line-height:1.35;margin:12px 0}.green{color:#8ff1bd}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:14px 18px;background:#a1f2c8;color:#10271d;font-weight:700;margin:4px 4px 4px 0}button.secondary{background:#344c63;color:white}button:disabled{opacity:.45}select{padding:10px;background:#2d4157;color:white;border:0;border-radius:8px}label{display:block;margin:10px 0}.status{font-size:13px;color:#bdd0de;line-height:1.6}h1{font-size:22px}small{color:#b2c7d8}a{color:#a1f2c8}</style></head><body><main><h1>🚕 東京タクシー交差点案内</h1><p class="sub">iPhone GPS × OpenStreetMap ｜ 試作版</p><div class="card"><div class="sub">現在の道路（推定）</div><div id="road" class="big">待機中</div><div class="sub">進行方向の名前付き交差点（推定）</div><div id="cross" class="big green">—</div><div id="distance" class="sub">開始すると周辺の交差点を検索します</div></div><div class="card"><button id="start">▶ 案内開始</button><button id="stop" class="secondary" disabled>■ 停止</button><button id="speak" class="secondary">🔊 音声テスト</button><label>モード <select id="mode"><option value="free">流し営業</option><option value="ride">実車（交差点案内）</option></select></label><label><input type="checkbox" id="voice" checked> 音声案内を使う</label><label>案内開始距離 <select id="threshold"><option value="200">200m</option><option value="300" selected>300m</option><option value="500">500m</option></select></label></div><div class="card"><div class="sub">状態</div><p id="status" class="status">位置情報を許可して開始してください。</p><p id="coords" class="status"></p></div><p class="status">⚠️ 実験用の補助情報です。交差点名や距離は保証されません。交通標識・道路状況を優先し、運転中は画面を操作・注視しないでください。iOS Safariでは画面ロック中やバックグラウンドで位置取得・読み上げが停止することがあります。HTTPSでの公開が必要です。</p><p class="status">地図データ © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> / ODbL</p></main><script>
const $=id=>document.getElementById(id);let watch=null,points=[],lastFetch=0,fetchCenter=null,heading=null,lastPosition=null,lastSpoken='',lastSpeakTime=0,fetching=false,fetchError='';const rad=x=>x*Math.PI/180;function distance(a,b){const R=6371000,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}function bearing(a,b){const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));return (Math.atan2(y,x)*180/Math.PI+360)%360}function angle(a,b){return Math.abs((a-b+540)%360-180)}function say(s){if(!$('voice').checked||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.95;speechSynthesis.speak(u)}function status(s){$('status').textContent=s}
async function fetchMap(p){if(fetching)return;fetching=true;lastFetch=Date.now();try{const q=`[out:json][timeout:18];(node(around:1000,${p.lat},${p.lon})[highway=traffic_signals][name];node(around:1000,${p.lat},${p.lon})[highway=traffic_signals][traffic_signals:name];node(around:1000,${p.lat},${p.lon})[junction][name];node(around:1000,${p.lat},${p.lon})[highway=crossing][name];);out body;`;const r=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:q})});if(!r.ok)throw Error('地図サーバー応答 '+r.status);const data=await r.json();points=(data.elements||[]).filter(e=>e.lat&&e.lon).map(e=>({lat:e.lat,lon:e.lon,name:e.tags?.['traffic_signals:name']||e.tags?.name})).filter(e=>e.name);fetchCenter=p;fetchError='';}catch(e){fetchError='交差点データ取得失敗: '+e.message;}finally{fetching=false}}
let roadTime=0;async function fetchRoad(p){if(Date.now()-roadTime<25000)return;roadTime=Date.now();try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.lat}&lon=${p.lon}&format=json&zoom=17&addressdetails=1&accept-language=ja`);if(!r.ok)throw Error('道路情報取得失敗');const d=await r.json(),a=d.address||{};$('road').textContent=a.road||a.pedestrian||a.residential||'道路名未登録';}catch(e){$('road').textContent='道路名を取得できません'}}
function update(pos){const c=pos.coords,p={lat:c.latitude,lon:c.longitude},accuracy=c.accuracy;let h=Number.isFinite(c.heading)&&c.heading>=0?c.heading:null;if(h===null&&lastPosition&&distance(lastPosition,p)>12)h=bearing(lastPosition,p);if(h!==null)heading=h;lastPosition=p;$('coords').textContent=`GPS精度 約${Math.round(accuracy)}m / 速度 ${c.speed==null?'不明':Math.max(0,Math.round(c.speed*3.6))+'km/h'} / 方位 ${heading==null?'不明':Math.round(heading)+'°'} / 検出交差点 ${points.length}件`;if(!fetchCenter||distance(fetchCenter,p)>350||Date.now()-lastFetch>90000)fetchMap(p).then(()=>render(p,accuracy));fetchRoad(p);render(p,accuracy)}
function render(p,accuracy){if(accuracy>80){$('cross').textContent='GPS精度不足';$('distance').textContent='位置情報の精度が改善するまで待機';return}if(heading===null){$('cross').textContent='進行方向を確認中';$('distance').textContent='少し移動すると方位を推定します';return}const ahead=points.map(x=>({...x,d:distance(p,x),delta:angle(heading,bearing(p,x))})).filter(x=>x.d>25&&x.d<950&&x.delta<30).sort((a,b)=>a.d-b.d);const next=ahead[0];if(!next){$('cross').textContent='候補なし';$('distance').textContent=fetchError||'前方の名前付き交差点が地図に見つかりません';return}$('cross').textContent=next.name;$('distance').textContent=`約${Math.round(next.d/10)*10}m先 / 方位差 ${Math.round(next.delta)}°（推定）`;const limit=Number($('threshold').value),now=Date.now(),key=next.name+':'+Math.round(next.lat*10000)+':'+Math.round(next.lon*10000);if(next.d<=limit&&key!==lastSpoken&&now-lastSpeakTime>20000){say(`この先およそ${Math.round(next.d/50)*50}メートル、${next.name}交差点です。`);lastSpoken=key;lastSpeakTime=now}status(`${$('mode').value==='ride'?'実車':'流し営業'} / 交差点案内中${fetchError?' / '+fetchError:''}`)}
$('start').onclick=()=>{if(!navigator.geolocation){status('この環境ではGPSを利用できません');return}lastSpoken='';$('start').disabled=true;$('stop').disabled=false;status('GPSを取得しています…');watch=navigator.geolocation.watchPosition(update,e=>{status('位置情報エラー: '+e.message+'。Safariの位置情報許可とHTTPSを確認してください。')},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})};$('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;speechSynthesis?.cancel();$('start').disabled=false;$('stop').disabled=true;status('停止しました')};$('speak').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('交差点案内の音声テストです');u.lang='ja-JP';speechSynthesis.speak(u)};
</script></body></html>
