<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERE Traffic 接続テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;color:#17333b}input,button{font-size:17px;padding:12px;border-radius:8px}input{width:100%;box-sizing:border-box;border:1px solid #9aa}button{background:#083a48;color:white;border:0;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5f6;padding:15px;border-radius:8px}small{color:#52676d}</style></head><body><h1>HERE Traffic 接続テスト</h1><p>東京駅周辺・半径1kmの交通流を1回だけ取得します。</p><label for="key">HERE APIキー（この画面内だけで使用）</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="APIキーを入力"><button id="run">接続テスト（1回）</button><p><small>キーは保存しません。URLにもキーを表示しません。通信時にはHEREのAPIへ送信します。GitHub Pages上で開いてください。</small></p><pre id="result">未実行</pre><script>document.getElementById('run').addEventListener('click',async()=>{const key=document.getElementById('key').value.trim(),out=document.getElementById('result'),btn=document.getElementById('run');if(!key){out.textContent='APIキーを入力してください。';return}btn.disabled=true;out.textContent='接続中…';try{const u=new URL('https://data.traffic.hereapi.com/v7/flow');u.searchParams.set('in','circle:35.6812,139.7671;r=1000');u.searchParams.set('locationReferencing','none');u.searchParams.set('apiKey',key);const r=await fetch(u,{cache:'no-store',referrerPolicy:'strict-origin-when-cross-origin'});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{data={message:raw.slice(0,350)}}if(r.ok){const rows=Array.isArray(data.results)?data.results:[];const jam=rows.map(x=>x.currentFlow?.jamFactor).filter(Number.isFinite);out.textContent='HTTP '+r.status+'：認証・通信成功\n更新時刻：'+(data.sourceUpdated||'不明')+'\n取得道路区間：'+rows.length+'件\n渋滞度(jamFactor)の最大値：'+(jam.length?Math.max(...jam):'データなし')}else{out.textContent='HTTP '+r.status+'\n'+JSON.stringify(data,null,2).slice(0,1000)+'\n※APIキー自体は画面に出していません。'}}catch(e){out.textContent='通信エラー：'+e.message+'\nGitHub Pagesから開いているか、信頼済みドメインとCORS設定を確認してください。'}finally{btn.disabled=false}})</script></body></html>
